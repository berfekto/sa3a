  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:4px 2px;">
    <div style="font-size:.8rem;font-weight:700;color:var(--dim)">
      👥 المسجلون: <b style="color:var(--txt)">${roster.length}</b> سباح | ⏱️ إجمالي الأرقام: <b style="color:var(--cyan)">${totalRecs}</b>
    </div>
  </div>`;
  
  if(roster.length === 0){
    html += `
    <div style="text-align:center;padding:40px 16px;">
      <div style="font-size:48px;margin-bottom:12px">🏊‍♂️</div>
      <h3 style="font-size:1.05rem;font-weight:800;color:var(--txt);margin-bottom:6px">لا يوجد سباحون مسجلون بعد</h3>
      <p style="font-size:.82rem;color:var(--dim);max-width:280px;margin:0 auto 16px;line-height:1.6">
        أضف أول سباح من زر "تسجيل سباح" أو ابدأ سباقاً وسيتم حفظ سجل أرقامه تلقائياً!
      </p>
      <button class="btn-quick-reg" onclick="promptAddRosterSwimmer()">➕ تسجيل أول سباح</button>
    </div>`;
    container.innerHTML = html;
    return;
  }
  
  if(swimmerList.length === 0){
    html += `
    <div style="text-align:center;padding:30px 16px;color:var(--dim)">
      <p>لم يتم العثور على أي سباح يطابق البحث "${esc(rosterSearchQuery)}"</p>
      <button class="btn-quick-reg" style="margin-top:10px" onclick="quickRegisterNamed('${esc(rosterSearchQuery)}')">➕ تسجيل "${esc(rosterSearchQuery)}" في السجل</button>
    </div>`;
    container.innerHTML = html;
    return;
  }
  
  html += `<div class="all-sw-grid">`;
  swimmerList.forEach(s => {
    const hist = s.history || [];
    const bestRec = hist.length > 0 ? [...hist].sort((a,b)=>a.elapsed-b.elapsed)[0] : null;
    const isCurrent = swimmers.some(act => act.name.trim().toLowerCase() === s.name.trim().toLowerCase());
    
    html += `
    <div class="sw-card-tile">
      <div class="sct-top">
        <span class="sct-dot" style="background:${s.colorHex||'var(--cyan)'}"></span>
        <span class="sct-name">${esc(s.name)}</span>
        ${isCurrent ? '<span style="font-size:.65rem;color:var(--green);font-weight:700">● في الحارة</span>' : ''}
      </div>
      <div class="sct-meta">
        <span>🏁 ${hist.length} سباق</span>
        <span>•</span>
        <span>${s.defaultDist}م ${s.defaultStroke}</span>
        ${bestRec ? `<span>• 🥇 ${bestRec.timeFmt}</span>` : ''}
      </div>
      <div class="sct-acts">
        <button class="sct-view" onclick="selectRosterTab('${esc(s.name)}')">📊 عرض السجل</button>
        <button class="sct-add" onclick="addSwimmerToActiveLanes('${esc(s.name)}')">${isCurrent ? '✓ موجود' : '🏊 إشراك'}</button>
        <button class="sct-del" onclick="confirmDeleteRosterSwimmer('${esc(s.name)}')" title="حذف السباح">🗑</button>
      </div>
    </div>`;
  });
  html += `</div>`;
  container.innerHTML = html;
}

function renderSingleSwimmerView(sw, container){
  const hist = sw.history || [];
  const isCurrent = swimmers.some(act => act.name.trim().toLowerCase() === sw.name.trim().toLowerCase());
  
  const pbs = {};
  hist.forEach(r => {
    const k = `${r.dist}م ${EMO[r.stroke]||'🏊'} ${r.stroke}`;
    if(!pbs[k] || r.elapsed < pbs[k].elapsed) pbs[k] = r;
  });
  const pbKeys = Object.keys(pbs);
  
  let html = `
  <!-- SWIMMER PROFILE BOX -->
  <div class="sw-prof-box">
    <div class="sw-prof-hdr">
      <div class="sw-prof-ava" style="background:${sw.colorHex||'var(--cyan)'}">
        ${esc(sw.name.charAt(0))}
      </div>
      <div class="sw-prof-info">
        <div class="sw-prof-name">${esc(sw.name)}</div>
        <div class="sw-prof-sub">
          الحدث المفضل: ${sw.defaultDist}م ${sw.defaultStroke} • إجمالي السباقات: <b>${hist.length}</b>
        </div>
      </div>
      <div class="sw-prof-acts">
        <button class="spa-btn spa-add" onclick="addSwimmerToActiveLanes('${esc(sw.name)}')">
          ${isCurrent ? '✓ موجود بالحارة' : '🏊 إشراك بالحارة'}
        </button>
        <button class="spa-btn spa-share" onclick="copySwimmerReport('${esc(sw.name)}')">
          📋 تقرير واتساب
        </button>
        <button class="spa-btn spa-del" onclick="confirmDeleteRosterSwimmer('${esc(sw.name)}')">
          🗑 حذف
        </button>
      </div>
    </div>
  </div>`;
  
  // PERSONAL BESTS SECTION
  html += `<div class="log-sec-title"><span>🥇</span> أفضل الأرقام الشخصية (PB):</div>`;
  if(pbKeys.length === 0){
    html += `<div style="font-size:.76rem;color:var(--dim);margin-bottom:12px">لم يتم تسجيل أرقام نهائية بعد. أنهِ جولة في المؤقت وسيظهر أفضل رقم هنا تلقائياً!</div>`;
  } else {
    html += `<div class="pb-grid">`;
    pbKeys.forEach(k => {
      const rec = pbs[k];
      html += `
      <div class="pb-card">
        <div class="pb-event">${k} 🥇</div>
        <div class="pb-time">${rec.timeFmt}</div>
        <div class="pb-date">📅 ${rec.date} (جولة ${rec.heat})</div>
      </div>`;
    });
    html += `</div>`;
  }
  
  // TIMELINE / RACE HISTORY
  html += `<div class="log-sec-title"><span>⏱️</span> سجل السباقات والأوقات (${hist.length}):</div>`;
  if(hist.length === 0){
    html += `
    <div style="text-align:center;padding:24px;background:rgba(15,23,42,.02);border-radius:12px;color:var(--dim);font-size:.82rem">
      لا يوجد سباقات مسجلة بعد لهذا السباح.
    </div>`;
  } else {
    html += `<div class="log-rec-list">`;
    hist.forEach(r => {
      const isPB = pbs[`${r.dist}م ${EMO[r.stroke]||'🏊'} ${r.stroke}`] && pbs[`${r.dist}م ${EMO[r.stroke]||'🏊'} ${r.stroke}`].id === r.id;
      
      html += `
      <div class="log-rec-item">
        <div class="log-rec-top">
          <div class="log-rec-meta">
            <span class="tag td">${r.dist}م</span>
            <span class="tag ts">${EMO[r.stroke]||'🏊'} ${r.stroke}</span>
            <span class="tag" style="background:rgba(217,119,6,.1);color:var(--gold)">🔥 جولة ${r.heat}</span>
            <span style="font-size:.68rem;color:var(--dim)">📅 ${r.date} ${r.time||''}</span>
            ${isPB ? '<span style="font-size:.68rem;color:var(--gold);font-weight:900">🥇 PB</span>' : ''}
          </div>
          <button class="btn-del-rec" onclick="deleteRosterRecord('${esc(sw.name)}','${r.id}')" title="حذف هذا الرقم">🗑</button>
        </div>
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <div class="log-rec-time">${r.timeFmt}</div>
          ${r.bestLap ? `<div style="font-size:.7rem;color:var(--mint);font-family:'Share Tech Mono',monospace">أسرع لفة: <b>+${fmtT(r.bestLap)}</b></div>` : ''}
        </div>
        ${r.laps && r.laps.length > 0 ? `
        <div class="log-rec-laps">
          ${r.laps.map((l, li) => {
            const isBestL = r.bestLap && l.split === r.bestLap && r.laps.length > 1;
            return `<span class="log-lap-tag ${isBestL?'best':''}">ل${li+1}: ${fmtT(l.total)} (+${fmtT(l.split)})</span>`;
          }).join('')}
        </div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }
  
  container.innerHTML = html;
}

function deleteRosterRecord(swimmerName, recId){
  const sw = findRosterSwimmer(swimmerName);
  if(!sw || !sw.history) return;
  sw.history = sw.history.filter(r => r.id !== recId);
  saveRoster();
  renderLogView();
  toast('🗑 تم حذف الوقت من السجل', 'w');
}

function confirmDeleteRosterSwimmer(swimmerName){
  showConfirm(
    `حذف ${swimmerName} من السجل`,
    `سيتم حذف ملف وسجل السباح "${swimmerName}" بالكامل مع جميع أرقامه المسجلة!`,
    'حذف نهائي',
    () => {
      roster = roster.filter(s => s.name.trim().toLowerCase() !== swimmerName.trim().toLowerCase());
      if(currentRosterFilter === swimmerName) currentRosterFilter = 'all';
      saveRoster();
      renderLogView();
      toast(`🗑 تم حذف السباح ${swimmerName} من السجل`, 'w');
    }
  );
}

function addSwimmerToActiveLanes(swimmerName){
  const existing = swimmers.find(s => s.name.trim().toLowerCase() === swimmerName.trim().toLowerCase());
  if(existing){
    toast(`⚠️ ${swimmerName} موجود بالفعل في الحارة م${existing.lane}`, 'w');
    closeLogModal();
    return;
  }
  const profile = findRosterSwimmer(swimmerName);
  if(!profile) return;
  const dist = profile.defaultDist || '50';
  const stroke = profile.defaultStroke || 'كرول';
  const ck = profile.colorKey || PAL[0].k;
  const p = PAL.find(x => x.k === ck) || PAL[0];
  
  const sw = mkSw(nid++, nlane++, profile.name, dist, stroke, ck, p.h);
  swimmers.push(sw);
  spawnCard(sw);
  renderEmpty();
  updateStats();
  updateSelRow();
  save();
  toast(`🏊 تم إشراك ${profile.name} بالحارة م${sw.lane}`, 'ok');
  closeLogModal();
}

function promptAddRosterSwimmer(){
  const name = prompt('أدخل اسم السباح الجديد لتسجيله في السجل:');
  if(name && name.trim()){
    quickRegisterNamed(name.trim());
  }
}

function quickRegisterNamed(name){
  if(!name || !name.trim()) return;
  const clean = name.trim();
  const ci = roster.length % PAL.length;
  const p = PAL[ci];
  registerInRoster(clean, '50', 'كرول', p.k, p.h);
  currentRosterFilter = clean;
  rosterSearchQuery = '';
  const srch = document.getElementById('log-srch');
  if(srch) srch.value = '';
  renderLogView();
  toast(`✅ تم تسجيل ${clean} في السجل بنجاح!`, 'ok');
}

function copySwimmerReport(swimmerName){
  const sw = findRosterSwimmer(swimmerName);
  if(!sw) return;
  const hist = sw.history || [];
  
  const pbs = {};
  hist.forEach(r => {
    const k = `${r.dist}م ${r.stroke}`;
    if(!pbs[k] || r.elapsed < pbs[k].elapsed) pbs[k] = r;
  });
  
  let report = `🏊‍♂️ سجل وإحصائيات السباح: ${sw.name}\n`;
  report += `━━━━━━━━━━━━━━━━━━━━━\n`;
  
  const pbKeys = Object.keys(pbs);
  if(pbKeys.length > 0){
    report += `🥇 أفضل الأرقام القياسية الشخصية (PB):\n`;
    pbKeys.forEach(k => {
      report += `• ${k}: ${pbs[k].timeFmt} (بتاريخ ${pbs[k].date})\n`;
    });
    report += `\n`;
  }
  
  report += `📊 سجل السباقات (${hist.length} سباق):\n`;
  if(hist.length === 0){
    report += `• لا توجد سباقات مسجلة بعد.\n`;
  } else {
    hist.forEach((r, idx) => {
      report += `${idx+1}) ${r.date} (جولة ${r.heat}) — ${r.dist}م ${r.stroke}: ${r.timeFmt}\n`;
      if(r.laps && r.laps.length > 1){
        report += `   اللفات: ` + r.laps.map((l, li) => `ل${li+1}: +${fmtT(l.split)}`).join(' | ') + `\n`;
      }
    });
  }
  report += `━━━━━━━━━━━━━━━━━━━━━\n`;
  report += `تم الاستخراج عبر مؤقت السباحة الاحترافي ⏱️`;
  
  navigator.clipboard.writeText(report).then(() => {
    toast(`📋 تم نسخ تقرير ${sw.name} بنجاح!`, 'ok');
  }).catch(() => {
    prompt('انسخ التقرير:', report);
  });
}

function updateAddSheetRoster(){
  const dl = document.getElementById('roster-dl');
  const chipsWrap = document.getElementById('roster-quick-wrap');
  const chipsList = document.getElementById('add-roster-chips');
  if(!dl || !chipsWrap || !chipsList) return;
  
  dl.innerHTML = roster.map(s => `<option value="${esc(s.name)}"></option>`).join('');
  
  if(roster.length === 0){
    chipsWrap.style.display = 'none';
    chipsList.innerHTML = '';
  } else {
    chipsWrap.style.display = 'block';
    chipsList.innerHTML = roster.map(s => `
      <button type="button" class="r-add-chip" onclick="fillAddFromRoster('${esc(s.name)}')">
        <span class="dot" style="background:${s.colorHex||'var(--cyan)'}"></span>
        <span>${esc(s.name)}</span>
      </button>
    `).join('');
  }
}

function onAddNameInput(val){
  const sw = findRosterSwimmer(val);
  if(sw){
    if(sw.defaultDist) document.getElementById('fd').value = sw.defaultDist;
    if(sw.defaultStroke) document.getElementById('fs').value = sw.defaultStroke;
    if(sw.colorKey){ clr = sw.colorKey; syncSwatchUI(); }
  }
}

function fillAddFromRoster(name){
  const sw = findRosterSwimmer(name);
  if(!sw) return;
  const fn = document.getElementById('fn');
  if(fn){ fn.value = sw.name; fn.focus(); }
  if(sw.defaultDist) document.getElementById('fd').value = sw.defaultDist;
  if(sw.defaultStroke) document.getElementById('fs').value = sw.defaultStroke;
  if(sw.colorKey){ clr = sw.colorKey; syncSwatchUI(); }
}

function initLogTouch(){
  const ov = document.getElementById('log-ov');
  const sh = document.getElementById('log-sh');
  if(!ov || !sh) return;
  ov.addEventListener('pointerdown', e => { if(e.target === ov) closeLogModal(); });
  let ty = 0;
  sh.addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener('touchend', e => {
    if(e.changedTouches[0].clientY - ty > 90 && sh.scrollTop <= 2) closeLogModal();
  }, { passive: true });
}
